name: Ritual Update

on:
  schedule:
    - cron: "0 10 * * *"  # Runs daily at 10:00 UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run update_readme.py
        run: |
          python update_readme.py

      - name: Commit and push changes
        run: |
          git config --global user.name "ritual-bot"
          git config --global user.email "ritual@users.noreply.github.com"
          git add README.md
          git commit -m "Ritual update"
          git push
